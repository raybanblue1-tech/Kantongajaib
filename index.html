<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Duitku – Cash Flow Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">

<style>
:root{--bg:#dff0fa;--card:#fff;--line:#0d2233;--sh:#0d2233;--tx:#0d2233;--mu:#5b7186;--y:#fbbf24;--b:#2f6fed;--t:#5ce1d0;--p:#ff8fb8;--r:#e0341c;--g:#0f9d58;--in:#eaf4fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1324;--card:#14223f;--line:#e9f0ff;--sh:#2f6fed;--tx:#f2f6ff;--mu:#9db0d0;--r:#ff7a66;--g:#4ade80;--in:#0f1b33}}
:root[data-theme="dark"]{--bg:#0b1324;--card:#14223f;--line:#e9f0ff;--sh:#2f6fed;--tx:#f2f6ff;--mu:#9db0d0;--r:#ff7a66;--g:#4ade80;--in:#0f1b33}
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:500;max-width:520px;margin-inline:auto;padding-bottom:130px}
.band{background:var(--b);color:#fff;border:3px solid var(--line);border-top:0;border-radius:0 0 34px 34px;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 70px}
.band.s{padding-bottom:26px}
.band small{font-weight:700;opacity:.92;display:block}
.band h1{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.band h1 u{text-decoration:none;cursor:pointer;border-bottom:3px dashed #fff}
.pad{padding:0 16px}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:5px 5px 0 var(--sh);padding:16px;margin-bottom:18px}
.saldo{margin-top:-52px;position:relative}
.big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--b)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big{color:#6ea2ff}}
.mu{color:var(--mu);font-size:13px;font-weight:700}
h2{font-size:17px;font-weight:800;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.g{background:none;border:0;color:var(--tx);font:800 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.g span{width:60px;height:60px;border:3px solid var(--line);border-radius:20px;display:grid;place-items:center;font-size:27px;box-shadow:3px 3px 0 var(--sh)}
.g:active span{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border:3px solid var(--line);border-radius:18px;padding:10px 12px;color:#0d2233;font-weight:800;font-size:12px}
.mini b{display:block;font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.btn{border:3px solid var(--line);background:var(--y);color:#0d2233;border-radius:14px;padding:10px 14px;font:800 14px inherit;font-family:inherit;box-shadow:3px 3px 0 var(--sh);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.btn.s{padding:6px 10px;font-size:12px;box-shadow:2px 2px 0 var(--sh)}
.btn.t{background:var(--t)}.btn.w{background:var(--card);color:var(--tx)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px}
.chip{flex:none;border:3px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;font:800 14px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--y);color:#0d2233}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.row:last-child{border:0}
.ic{flex:none;width:46px;height:46px;border:3px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--t)}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:15px}.row .m span{color:var(--mu);font-size:12px;font-weight:700}
.amt{font-weight:800;white-space:nowrap}.neg{color:var(--r)}.pos{color:var(--g)}
.day{font-size:12px;font-weight:800;color:var(--mu);margin:14px 4px 8px;display:flex;justify-content:space-between;text-transform:uppercase}
.bar{height:16px;border:3px solid var(--line);border-radius:99px;background:var(--in);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--t);border-right:3px solid var(--line)}
.bar.r i{background:var(--y)}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(492px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:5px 5px 0 var(--sh);padding:6px;z-index:5}
nav button{border:3px solid transparent;background:none;border-radius:20px;padding:7px 2px;font:800 11px inherit;font-family:inherit;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:22px}
nav button.on{background:var(--y);color:#0d2233;border-color:var(--line)}
#md{position:fixed;inset:0;background:rgba(3,8,18,.65);display:none;align-items:flex-end;justify-content:center;z-index:60}
#md.on{display:flex}
#sheet{background:var(--bg);border:3px solid var(--line);border-radius:26px 26px 0 0;width:min(520px,100%);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-weight:800;font-size:13px;margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;border:3px solid var(--line);border-radius:14px;padding:11px 12px;font:600 16px inherit;font-family:inherit;background:var(--card);color:var(--tx)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--y);color:#0d2233;border:3px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;font-size:13px;display:none;z-index:70;max-width:90%}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#lock.on{display:flex}
.dots{display:flex;gap:12px;margin:18px 0;justify-content:center}
.dots i{width:18px;height:18px;border:3px solid var(--line);border-radius:50%;background:var(--card)}
.dots i.f{background:var(--y)}
.pad4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.pad4 button{height:62px;font-size:22px}
</style>
</head>
<body>
<header class="band" id="band"></header>
<div class="pad" id="app"></div>
<nav id="nav"></nav>
<div id="md"><div id="sheet"><h2 id="mt"></h2><form id="mf"></form></div></div>
<div id="lock"></div>
<div id="toast"></div>
<script>
var S;try{S=JSON.parse(localStorage.getItem("aa-cf"))}catch(e){}
S=S||{};S.tx=S.tx||[];S.goals=S.goals||[];S.debts=S.debts||[];S.name=S.name||"Aris";S.usd=S.usd||0;S.gold=S.gold||0;S.wallets=S.wallets&&S.wallets.length?S.wallets:[{id:"w1",name:"Tunai",emo:"💵"},{id:"w2",name:"Bank",emo:"🏦"},{id:"w3",name:"E-wallet",emo:"📱"}];S.bud=S.bud||{};S.tr=S.tr||[];S.pin=S.pin||"";S.lw=S.lw||"";
var tab="home",hide=false,q="",mon=ym(new Date());
var OUT={"Makanan & Minuman":"🍔","Transport":"🛵","Belanja":"🛍️","Tagihan":"💡","Hiburan":"🎮","Selfcare":"💆","Tabungan":"🐷","Hutang":"💸","Lainnya":"📦"};
var INC={"Gaji":"💰","Usaha":"🏪","Bonus":"🎁","Piutang":"🤝","Lainnya":"✨","Saldo awal":"🏦","Tarik tabungan":"🐷"};
var TABS=[["home","🏠","Beranda"],["tx","🧾","Mutasi"],["db","🤝","Hutang"],["sv","🐷","Tabungan"]];
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){var d=new Date();return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function save(){try{localStorage.setItem("aa-cf",JSON.stringify(S))}catch(e){toast("⚠️ Data gagal tersimpan. Jangan pakai mode privat, lalu coba lagi.")}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function hid(n){return hide?"Rp••••••":rp(n)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2800)}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function net(t){return t.type==="in"?t.amt:-t.amt}
function monthList(){var o=[],d=new Date();for(var i=5;i>=0;i--)o.push(ym(new Date(d.getFullYear(),d.getMonth()-i,1)));S.tx.forEach(function(t){var m=t.date.slice(0,7);if(o.indexOf(m)<0)o.push(m)});return o.sort()}
function mname(m,full){var p=m.split("-");return new Date(p[0],p[1]-1,1).toLocaleDateString("id-ID",full?{month:"long",year:"numeric"}:{month:"short",year:"numeric"})}
function chips(){return "<div class=\"chips\">"+monthList().map(function(m){return "<button class=\"chip"+(m===mon?" on":"")+"\" onclick=\"mon='"+m+"';render()\">"+mname(m)+"</button>"}).join("")+"</div>"}
function form(title,fields,cb,btn){
  document.getElementById("mt").textContent=title;
  var f=document.getElementById("mf");
  f.innerHTML=fields.map(function(x){var v=x.v==null?"":x.v;return "<label>"+esc(x.l)+(x.o?"<select name=\""+x.k+"\">"+x.o.map(function(o){return "<option"+(o===x.v?" selected":"")+">"+esc(o)+"</option>"}).join("")+"</select>":x.t==="area"?"<textarea name=\""+x.k+"\" rows=\"5\"></textarea>":"<input name=\""+x.k+"\" type=\""+(x.t==="number"?"text":(x.t||"text"))+"\" value=\""+esc(v)+"\""+(x.t==="number"?" data-num=\"1\" inputmode=\"numeric\"":x.t==="password"?" inputmode=\"numeric\" maxlength=\"6\" autocomplete=\"off\"":"")+" autocomplete=\"off\">")+"</label>"}).join("")+"<div class=\"acts\"><button class=\"btn\" type=\"submit\">"+(btn||"Simpan")+"</button><button class=\"btn w\" type=\"button\" onclick=\"closeM()\">Batal</button></div>";
  f.onsubmit=function(e){e.preventDefault();var v={};fields.forEach(function(x){var r=f.elements[x.k].value;v[x.k]=x.t==="number"?r.replace(/\D/g,""):r});if(cb(v)!==false)closeM()};f.querySelectorAll("[data-num]").forEach(function(i){i.oninput=function(){var d=i.value.replace(/\D/g,"");i.value=d?(+d).toLocaleString("id-ID"):""};i.oninput()});
  var ty=f.elements.type,ct=f.elements.cat;
  if(ty&&ct)ty.onchange=function(){var c=ty.value==="Pemasukan"?INC:OUT;ct.innerHTML=Object.keys(c).map(function(k){return "<option>"+esc(k)+"</option>"}).join("")};
  document.getElementById("md").classList.add("on");
}
function closeM(){document.getElementById("md").classList.remove("on")}
function addTx(type,saldo){
  var inc=type==="in";
  form(inc?"Catat pemasukan":"Catat pengeluaran",[{k:"type",l:"Jenis",o:["Pengeluaran","Pemasukan"],v:inc?"Pemasukan":"Pengeluaran"},{k:"amt",l:"Jumlah (Rp)",t:"number"},{k:"cat",l:"Kategori",o:Object.keys(inc?INC:OUT),v:saldo?"Saldo awal":undefined},{k:"w",l:"Dompet",o:wopt(),v:wname(S.lw)},{k:"note",l:"Catatan (opsional)"},{k:"date",l:"Tanggal",t:"date",v:today()}],function(v){
    var a=+v.amt;if(!(a>0)){toast("Isi jumlahnya dulu ya");return false}
    S.tx.push({id:uid(),type:v.type==="Pemasukan"?"in":"out",cat:v.cat,amt:a,note:v.note,date:v.date||today(),w:wid(v.w)});S.lw=wid(v.w);mon=(v.date||today()).slice(0,7);save();render()});
}
function wdef(){return S.wallets[0].id}
function wname(id){var w=S.wallets.find(function(x){return x.id===id});return w?w.name:S.wallets[0].name}
function wid(n){var w=S.wallets.find(function(x){return x.name===n});return w?w.id:wdef()}
function wopt(){return S.wallets.map(function(w){return w.name})}
function wof(t){return S.wallets.some(function(w){return w.id===t.w})?t.w:wdef()}
function wbal(id){return sum(S.tx.filter(function(t){return wof(t)===id}),net)-sum(S.tr.filter(function(r){return r.from===id}),function(r){return r.amt})+sum(S.tr.filter(function(r){return r.to===id}),function(r){return r.amt})}
function vWl(){
  var h="<div class=\"card\" style=\"margin-top:16px\"><div class=\"mu\">Total semua dompet</div><div class=\"big\">"+hid(sum(S.wallets,function(w){return wbal(w.id)}))+"</div><div class=\"acts\"><button class=\"btn\" onclick=\"addWallet()\">+ Dompet</button><button class=\"btn t\" onclick=\"transfer()\">⇄ Transfer</button></div></div>";
  S.wallets.forEach(function(w){var b=wbal(w.id);h+="<div class=\"card\"><div class=\"row\" style=\"border:0;padding:0\"><div class=\"ic\" style=\"color:#0d2233\">"+esc(w.emo)+"</div><div class=\"m\"><b>"+esc(w.name)+"</b><span>Saldo dompet</span></div><div class=\"amt "+(b<0?"neg":"")+"\">"+(b<0?"−":"")+hid(Math.abs(b))+"</div></div><div class=\"acts\"><button class=\"btn w s\" onclick=\"editWallet('"+w.id+"')\">Ubah</button>"+(S.wallets.length>1?"<button class=\"btn w s\" onclick=\"delWallet('"+w.id+"')\">Hapus</button>":"")+"</div></div>"});
  if(S.tr.length)h+="<div class=\"day\"><span>Transfer terakhir</span></div><div class=\"card\">"+S.tr.slice(-5).reverse().map(function(r){return "<div class=\"row\"><div class=\"ic\" style=\"color:#0d2233\">⇄</div><div class=\"m\"><b>"+esc(wname(r.from))+" → "+esc(wname(r.to))+"</b><span>"+r.date+"</span></div><div class=\"amt\">"+rp(r.amt)+"</div></div>"}).join("")+"</div>";
  return h;
}
function addWallet(){form("Dompet baru",[{k:"emo",l:"Emoji",v:"👛"},{k:"name",l:"Nama dompet (mis. DANA, BCA)"}],function(v){var n=v.name.trim();if(!n||wopt().indexOf(n)>=0){toast("Nama kosong atau sudah dipakai");return false}S.wallets.push({id:uid(),name:n,emo:v.emo||"👛"});save();render()})}
function editWallet(id){var w=S.wallets.find(function(x){return x.id===id});form("Ubah dompet",[{k:"emo",l:"Emoji",v:w.emo},{k:"name",l:"Nama",v:w.name}],function(v){var n=v.name.trim();if(!n||S.wallets.some(function(x){return x.name===n&&x.id!==id})){toast("Nama kosong atau sudah dipakai");return false}w.name=n;w.emo=v.emo||w.emo;save();render()})}
function delWallet(id){form("Hapus dompet ini? Transaksinya pindah ke dompet pertama, transfer terkait dihapus.",[],function(){S.tx.forEach(function(t){if(t.w===id)t.w=""});S.tr=S.tr.filter(function(r){return r.from!==id&&r.to!==id});S.wallets=S.wallets.filter(function(x){return x.id!==id});S.tx.forEach(function(t){if(!t.w)t.w=wdef()});save();render()},"Ya, hapus")}
function transfer(){if(S.wallets.length<2){toast("Tambah dompet dulu");return}var n=wopt();form("Transfer antar dompet",[{k:"f",l:"Dari",o:n,v:n[0]},{k:"t",l:"Ke",o:n,v:n[1]},{k:"amt",l:"Jumlah (Rp)",t:"number"},{k:"date",l:"Tanggal",t:"date",v:today()}],function(v){var a=+v.amt;if(!(a>0)||v.f===v.t){toast("Cek jumlah dan pilihan dompetnya");return false}S.tr.push({id:uid(),from:wid(v.f),to:wid(v.t),amt:a,date:v.date||today()});save();render()})}
var BC=Object.keys(OUT).filter(function(k){return k!=="Tabungan"&&k!=="Hutang"});
function spent(m,c){return sum(S.tx.filter(function(t){return t.type==="out"&&t.cat===c&&t.date.slice(0,7)===m}),function(t){return t.amt})}
function vBg(){
  var tl=0,ts=0;BC.forEach(function(c){if(S.bud[c]){tl+=S.bud[c];ts+=spent(mon,c)}});
  var h="<div style=\"margin-top:16px\">"+chips()+"</div><div class=\"card\"><div class=\"mu\">Total anggaran "+mname(mon,1)+"</div><div class=\"big\" style=\"font-size:22px\">"+(tl?hid(ts)+" / "+hid(tl):"Belum diatur")+"</div>"+(tl?"<div class=\"bar r\"><i style=\"width:"+Math.min(100,ts/tl*100)+"%"+(ts>tl?";background:var(--r)":"")+"\"></i></div>":"<div class=\"mu\">Atur batas per kategori supaya pengeluaran terkontrol. Tabungan dan hutang tidak dihitung.</div>")+"</div>";
  BC.forEach(function(c,i){var l=S.bud[c]||0,sp=spent(mon,c),p=l?Math.min(100,sp/l*100):0,over=l&&sp>l;
    h+="<div class=\"card\"><div class=\"row\" style=\"border:0;padding:0\"><div class=\"ic\" style=\"color:#0d2233\">"+OUT[c]+"</div><div class=\"m\"><b>"+esc(c)+"</b><span>"+(l?(over?"⚠️ Lewat "+rp(sp-l):"Sisa "+rp(l-sp)):"Belum ada batas")+"</span></div><div class=\"amt\">"+rp(sp)+(l?" / "+rp(l):"")+"</div></div>"+(l?"<div class=\"bar r\"><i style=\"width:"+p+"%"+(over?";background:var(--r)":"")+"\"></i></div>":"")+"<div class=\"acts\"><button class=\"btn t s\" onclick=\"setBud("+i+")\">"+(l?"Ubah batas":"Atur batas")+"</button></div></div>"});
  return h;
}
function setBud(i){var c=BC[i];form("Batas bulanan: "+c,[{k:"a",l:"Batas per bulan (Rp), kosongkan untuk hapus",t:"number",v:S.bud[c]||""}],function(v){var a=+v.a;if(a>0)S.bud[c]=a;else delete S.bud[c];save();render()})}
var pbuf="",lockedAt=0;
async function H(p){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("duitku:"+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){return "x"+p.split("").reduce(function(a,c){return (a*31+c.charCodeAt(0))|0},7)}}
function showLock(){if(!S.pin)return;pbuf="";document.getElementById("lock").classList.add("on");drawLock()}
function drawLock(msg){document.getElementById("lock").innerHTML="<div class=\"card\" style=\"width:min(340px,100%);text-align:center;margin:0\"><div style=\"font-size:40px\">🔒</div><h2 style=\"margin:6px 0 0\">Masukkan PIN</h2><div class=\"mu\">"+(msg||"Duitku terkunci")+"</div><div class=\"dots\">"+Array.from({length:Math.max(4,pbuf.length)},function(_,i){return i<pbuf.length?"<i class=\"f\"></i>":"<i></i>"}).join("")+"</div><div class=\"pad4\">"+["1","2","3","4","5","6","7","8","9","⌫","0","OK"].map(function(k){return "<button class=\"btn "+(k==="OK"?"t":"w")+"\" onclick=\"pk('"+k+"')\">"+k+"</button>"}).join("")+"</div><button class=\"btn w s\" onclick=\"forgot()\">Lupa PIN</button></div>"}
function pk(k){if(k==="⌫")pbuf=pbuf.slice(0,-1);else if(k==="OK"){var p=pbuf;H(p).then(function(h){pbuf="";if(h===S.pin)document.getElementById("lock").classList.remove("on");else drawLock("PIN salah, coba lagi")});return}else if(pbuf.length<6)pbuf+=k;drawLock()}
function forgot(){form("Reset semua data? Semua data di perangkat ini dihapus. Setelah itu pulihkan dari file cadangan.",[],function(){try{localStorage.removeItem("aa-cf")}catch(e){}location.reload()},"Ya, reset")}
function pinSet(){var F=[];if(S.pin)F.push({k:"cur",l:"PIN saat ini",t:"password"});F.push({k:"n1",l:S.pin?"PIN baru (kosongkan untuk mematikan)":"Buat PIN (4–6 angka)",t:"password"},{k:"n2",l:"Ulangi PIN baru",t:"password"});form(S.pin?"Kunci PIN":"Buat kunci PIN",F,function(v){pinGo(v);return false})}
async function pinGo(v){
  if(S.pin&&(await H(v.cur||""))!==S.pin){toast("PIN saat ini salah");return}
  if(!v.n1){if(!S.pin){toast("Isi PIN baru dulu");return}S.pin="";save();closeM();toast("Kunci PIN dimatikan");return}
